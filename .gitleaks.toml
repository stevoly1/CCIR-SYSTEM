# .gitleaks.toml — secret scan configuration (Phase 4a).
# The default gitleaks rules apply. An allowlist entry is added only for a value confirmed to
# exist solely for tests (never a real credential anywhere), with a comment saying where and why.
# This file is the only way to silence a finding: the scan ignores inline gitleaks:allow comments
# and refuses a .gitleaksignore file (scripts/ci/checkSecrets.js).
[extend]
useDefault = true
