openapi: 3.1.0
info:
  title: CCIR API
  version: 1.0.0
  summary: Civic Complaint and Infrastructure Reporting backend.
  description: >
    Citizens file complaints about public infrastructure; agency staff and administrators triage,
    assign and resolve them.


    **Sessions.** Signing in sets two signed, HTTP-only cookies: `accessToken` (short-lived) and
    `refreshToken`. A request whose access token has expired is renewed from the refresh token
    automatically. There is no bearer-token mode.


    **Browser origin.** Every POST, PUT, PATCH and DELETE must carry an `Origin` header equal to the
    configured `BROWSER_ORIGIN`; otherwise the response is 403 `FORBIDDEN` ("Request origin is not
    allowed").


    **Errors.** Every error uses one envelope: `{ error: { code, message, details? }, msg }`.
    Unexpected server errors (500) also carry `error.requestId`, which matches the `X-Request-Id`
    response header and the server log line.


    **Request IDs.** Every response carries `X-Request-Id`. A caller may send its own
    `X-Request-Id` (8–64 characters of `A-Z a-z 0-9 . _ -`); anything else is replaced.


    **Rate limits.** 300 requests per 15 minutes for each signed-in account, and 300 for each
    client address without a valid session; all requests from one client address are also capped
    at 3000 per 15 minutes. Health probes are exempt. Sign-in and session refresh have tighter limits.
    Over-limit requests get 429 `RATE_LIMITED` with `Retry-After`.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: /api/v1
tags:
  - name: auth
    description: Sign-up, sign-in and Google sign-in.
  - name: users
    description: The signed-in user's profile, and user administration.
  - name: categories
    description: Complaint categories.
  - name: complaints
    description: Filing, reading and managing complaints.
  - name: location
    description: Address suggestions and geocoding.
  - name: health
    description: Liveness and readiness probes.
  - name: contract
    description: This document.

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: accessToken
      description: Signed HTTP-only access-token cookie set by sign-in; renewed automatically from the `refreshToken` cookie.

  headers:
    RequestId:
      description: Request identifier; quote it when reporting a problem.
      schema:
        type: string
        pattern: '^[A-Za-z0-9._-]{8,64}$'
    SessionCookies:
      description: Sets the signed, HTTP-only `accessToken` and `refreshToken` cookies.
      schema:
        type: string
    RetryAfter:
      description: Seconds until the limit resets.
      schema:
        type: integer

  parameters:
    Id:
      name: id
      in: path
      required: true
      description: A 24-character hexadecimal identifier.
      schema:
        $ref: '#/components/schemas/ObjectId'
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Search:
      name: search
      in: query
      description: Case-insensitive text match; matched literally, never as a pattern.
      schema:
        type: string
        maxLength: 200

  schemas:
    ObjectId:
      type: string
      pattern: '^[0-9a-fA-F]{24}$'
    Status:
      type: string
      enum: [PENDING, IN_REVIEW, IN_PROGRESS, RESOLVED, REJECTED, WITHDRAWN]
    Priority:
      type: string
      enum: [LOW, MEDIUM, HIGH, CRITICAL]
    Role:
      type: string
      enum: [citizen, admin, agency]

    Error:
      type: object
      additionalProperties: false
      required: [error, msg]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [path, code, message]
                properties:
                  path:
                    type: string
                  code:
                    type: string
                  message:
                    type: string
            requestId:
              type: string
              description: Present on 500 responses only.
        msg:
          type: string

    Message:
      type: object
      additionalProperties: false
      required: [msg]
      properties:
        msg:
          type: string

    Pagination:
      type: object
      additionalProperties: false
      required: [page, limit, total, pages]
      properties:
        page:
          type: integer
          minimum: 1
        limit:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0
        pages:
          type: integer
          minimum: 0

    Identity:
      type: object
      description: A contact-free identity. A retired account reads "Retired account"; a deleted one "Unavailable account".
      additionalProperties: false
      required: [userId, displayName]
      properties:
        userId:
          $ref: '#/components/schemas/ObjectId'
        displayName:
          type: string
        role:
          $ref: '#/components/schemas/Role'

    User:
      type: object
      description: A user account as the account holder or an administrator sees it. Passwords are never returned.
      additionalProperties: false
      required: [_id, name, email, role, isActive, authProvider, createdAt, updatedAt]
      properties:
        _id:
          $ref: '#/components/schemas/ObjectId'
        name:
          type: string
        email:
          type: string
        phone:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        isActive:
          type: boolean
        authProvider:
          type: string
          enum: [local, google]
        googleId:
          type: string
        avatarUrl:
          type: string
        retiredAt:
          type: [string, 'null']
          format: date-time
        retiredBy:
          $ref: '#/components/schemas/ObjectId'
        retirementReason:
          type: string
        suspendedAt:
          type: string
          format: date-time
          description: When an administrator suspended the account. Absent while the account is active.
        suspendedBy:
          $ref: '#/components/schemas/ObjectId'
        suspensionReason:
          type: string
          description: The administrator's reason for the suspension, if one was given.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        __v:
          type: integer

    AssignableUser:
      type: object
      additionalProperties: false
      required: [userId, displayName]
      properties:
        userId:
          $ref: '#/components/schemas/ObjectId'
        displayName:
          type: string

    CitizenCategory:
      type: object
      description: The category fields a citizen sees (active categories only).
      additionalProperties: false
      required: [_id, name, description]
      properties:
        _id:
          $ref: '#/components/schemas/ObjectId'
        name:
          type: string
        description:
          type: string

    Category:
      type: object
      additionalProperties: false
      required: [_id, name, defaultPriority, isActive, nameKey, slug]
      properties:
        _id:
          $ref: '#/components/schemas/ObjectId'
        name:
          type: string
        description:
          type: string
        defaultPriority:
          $ref: '#/components/schemas/Priority'
        isActive:
          type: boolean
        nameKey:
          type: string
          description: Normalised name used for uniqueness.
        slug:
          type: string
        complaintCount:
          type: integer
          minimum: 0
          description: Administrators' category list only.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        __v:
          type: integer

    ComplaintCategory:
      type: object
      additionalProperties: false
      required: [_id, name, recordedName, isActive, deleted]
      properties:
        _id:
          type: [string, 'null']
        name:
          type: string
        recordedName:
          type: string
          description: The category name when the complaint was filed.
        isActive:
          type: boolean
        deleted:
          type: boolean

    TimelineEntry:
      type: object
      description: A status-history entry as the reporter sees it.
      additionalProperties: false
      required: [_id, type, status, actorLabel, createdAt]
      properties:
        _id:
          type: [string, 'null']
        type:
          type: string
          enum: [CREATED, STATUS_CHANGED, PRIORITY_CHANGED, WITHDRAWN]
        status:
          $ref: '#/components/schemas/Status'
        priorityChange:
          $ref: '#/components/schemas/PriorityChange'
        publicNote:
          type: string
        actorLabel:
          type: string
          enum: [You, Administrator, Agency staff, Reporter, System]
        createdAt:
          type: string
          format: date-time

    StaffTimelineEntry:
      type: object
      description: A status-history entry as staff see it, with the actor and any internal note.
      additionalProperties: false
      required: [_id, type, status, actorLabel, createdAt, actor]
      properties:
        _id:
          type: [string, 'null']
        type:
          type: string
          enum: [CREATED, STATUS_CHANGED, PRIORITY_CHANGED, WITHDRAWN]
        status:
          $ref: '#/components/schemas/Status'
        priorityChange:
          $ref: '#/components/schemas/PriorityChange'
        publicNote:
          type: string
        internalNote:
          type: string
        actorLabel:
          type: string
          enum: [You, Administrator, Agency staff, Reporter, System]
        actor:
          oneOf:
            - $ref: '#/components/schemas/Identity'
            - type: 'null'
        createdAt:
          type: string
          format: date-time

    PriorityChange:
      type: object
      additionalProperties: false
      required: [from, to]
      properties:
        from:
          $ref: '#/components/schemas/Priority'
        to:
          $ref: '#/components/schemas/Priority'

    ComplaintSummary:
      type: object
      description: A list row as the reporter sees it.
      additionalProperties: false
      required: [_id, referenceCode, status, priority, description, category, address, hasPrecisePosition, imageCount, thumbnailUrl, createdAt, updatedAt]
      properties:
        _id:
          $ref: '#/components/schemas/ObjectId'
        referenceCode:
          type: string
        status:
          $ref: '#/components/schemas/Status'
        priority:
          $ref: '#/components/schemas/Priority'
        description:
          type: string
        category:
          $ref: '#/components/schemas/ComplaintCategory'
        address:
          type: [string, 'null']
        hasPrecisePosition:
          type: boolean
        imageCount:
          type: integer
          minimum: 0
        thumbnailUrl:
          type: [string, 'null']
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    StaffComplaintSummary:
      type: object
      description: A list row as staff see it, with the reporter and assignee.
      additionalProperties: false
      required: [_id, referenceCode, status, priority, description, category, address, hasPrecisePosition, imageCount, thumbnailUrl, createdAt, updatedAt, reporter, assignee]
      properties:
        _id:
          $ref: '#/components/schemas/ObjectId'
        referenceCode:
          type: string
        status:
          $ref: '#/components/schemas/Status'
        priority:
          $ref: '#/components/schemas/Priority'
        description:
          type: string
        category:
          $ref: '#/components/schemas/ComplaintCategory'
        address:
          type: [string, 'null']
        hasPrecisePosition:
          type: boolean
        imageCount:
          type: integer
          minimum: 0
        thumbnailUrl:
          type: [string, 'null']
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        reporter:
          $ref: '#/components/schemas/Identity'
        assignee:
          oneOf:
            - $ref: '#/components/schemas/Identity'
            - type: 'null'

    ComplaintOwnerView:
      type: object
      description: >
        A complaint as its reporter sees it. Staff-only fields (assignee, precise location, internal
        notes, assignment and edit history, AI details) are absent, and any extra field is a contract
        violation.
      additionalProperties: false
      required: [_id, referenceCode, status, priority, description, category, address, hasPrecisePosition, imageCount, thumbnailUrl, createdAt, updatedAt, reporter, version, images, ai, timeline, responsibility, canEdit, canWithdraw]
      properties:
        _id:
          $ref: '#/components/schemas/ObjectId'
        referenceCode:
          type: string
        status:
          $ref: '#/components/schemas/Status'
        priority:
          $ref: '#/components/schemas/Priority'
        description:
          type: string
        category:
          $ref: '#/components/schemas/ComplaintCategory'
        address:
          type: [string, 'null']
        hasPrecisePosition:
          type: boolean
        imageCount:
          type: integer
          minimum: 0
        thumbnailUrl:
          type: [string, 'null']
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        reporter:
          $ref: '#/components/schemas/Identity'
        version:
          type: integer
          minimum: 0
          description: Send back as `expectedVersion` to guard against lost updates.
        images:
          type: array
          items:
            $ref: '#/components/schemas/Image'
        ai:
          type: object
          additionalProperties: false
          required: [summary, tags]
          properties:
            summary:
              type: string
            tags:
              type: array
              items:
                type: string
        timeline:
          type: array
          items:
            $ref: '#/components/schemas/TimelineEntry'
        responsibility:
          type: string
          enum: [ASSIGNED, AWAITING_ASSIGNMENT]
        canEdit:
          type: boolean
        canWithdraw:
          type: boolean

    ComplaintStaffView:
      type: object
      description: A complaint as agency staff and administrators see it.
      additionalProperties: false
      required: [_id, referenceCode, status, priority, description, category, address, hasPrecisePosition, imageCount, thumbnailUrl, createdAt, updatedAt, reporter, assignee, version, images, ai, timeline, responsibility, canEdit, canWithdraw, location, assignmentHistory, editHistory, allowedTransitions, canChangePriority, canAssign, canDelete, resolvedAt, resolvedAtEstimated]
      properties:
        _id:
          $ref: '#/components/schemas/ObjectId'
        referenceCode:
          type: string
        status:
          $ref: '#/components/schemas/Status'
        priority:
          $ref: '#/components/schemas/Priority'
        description:
          type: string
        category:
          $ref: '#/components/schemas/ComplaintCategory'
        address:
          type: [string, 'null']
        hasPrecisePosition:
          type: boolean
        imageCount:
          type: integer
          minimum: 0
        thumbnailUrl:
          type: [string, 'null']
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        reporter:
          $ref: '#/components/schemas/Identity'
        assignee:
          oneOf:
            - $ref: '#/components/schemas/Identity'
            - type: 'null'
        version:
          type: integer
          minimum: 0
        images:
          type: array
          items:
            $ref: '#/components/schemas/Image'
        ai:
          type: object
          additionalProperties: false
          required: [suggestedCategory, confidence, summary, tags, classifiedAt, error, inputMode, analysisCount]
          properties:
            suggestedCategory:
              type: [string, 'null']
            confidence:
              type: [number, 'null']
            summary:
              type: string
            tags:
              type: array
              items:
                type: string
            classifiedAt:
              type: [string, 'null']
              format: date-time
            error:
              type: [string, 'null']
              description: Why the fallback classification was used (TIMEOUT, NETWORK_ERROR, PROVIDER_ERROR, INVALID_OUTPUT).
            inputMode:
              type: [string, 'null']
              enum: [TEXT_ONLY, TEXT_AND_IMAGE, null]
            analysisCount:
              type: [integer, 'null']
        timeline:
          type: array
          items:
            $ref: '#/components/schemas/StaffTimelineEntry'
        responsibility:
          type: string
          enum: [ASSIGNED, AWAITING_ASSIGNMENT]
        canEdit:
          type: boolean
        canWithdraw:
          type: boolean
        location:
          type: object
          additionalProperties: false
          required: [address, latitude, longitude, coordinateSource]
          properties:
            address:
              type: [string, 'null']
            latitude:
              type: [number, 'null']
            longitude:
              type: [number, 'null']
            coordinateSource:
              type: [string, 'null']
              enum: [DEVICE, SUGGESTION, null]
        assignmentHistory:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [type, previous, next, changedBy, createdAt]
            properties:
              type:
                type: string
                enum: [ASSIGNED, REASSIGNED, UNASSIGNED, RETIREMENT_UNASSIGNMENT, WITHDRAWAL_UNASSIGNMENT, LEGACY_STATE_IMPORT]
              previous:
                oneOf:
                  - $ref: '#/components/schemas/Identity'
                  - type: 'null'
              next:
                oneOf:
                  - $ref: '#/components/schemas/Identity'
                  - type: 'null'
              changedBy:
                oneOf:
                  - $ref: '#/components/schemas/Identity'
                  - type: 'null'
              reason:
                type: string
              migrationMarker:
                type: string
                enum: [PHASE_1_MIGRATION]
              createdAt:
                type: string
                format: date-time
        editHistory:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [editedAt, editedBy, fields, reanalysed]
            properties:
              editedAt:
                type: string
                format: date-time
              editedBy:
                oneOf:
                  - $ref: '#/components/schemas/Identity'
                  - type: 'null'
              fields:
                type: array
                items:
                  type: string
                  enum: [description, location]
              reanalysed:
                type: boolean
              aiError:
                type: string
        allowedTransitions:
          type: array
          items:
            $ref: '#/components/schemas/Status'
        canChangePriority:
          type: boolean
        canAssign:
          type: boolean
        canDelete:
          type: boolean
        resolvedAt:
          type: [string, 'null']
          format: date-time
        resolvedAtEstimated:
          type: boolean

    Complaint:
      description: The reporter's view or the staff view, depending on who asks.
      oneOf:
        - $ref: '#/components/schemas/ComplaintOwnerView'
        - $ref: '#/components/schemas/ComplaintStaffView'

    Image:
      type: object
      additionalProperties: false
      required: [url]
      properties:
        url:
          type: string

    Place:
      type: object
      additionalProperties: false
      required: [address, latitude, longitude]
      properties:
        address:
          type: [string, 'null']
        latitude:
          type: number
        longitude:
          type: number

    Prediction:
      type: object
      additionalProperties: false
      required: [label, address, latitude, longitude]
      properties:
        label:
          type: string
        address:
          type: string
        latitude:
          type: number
        longitude:
          type: number

    DatabaseCheck:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, degraded, unavailable]
        reason:
          type: string
          enum: [DATABASE_DISCONNECTED, DATABASE_TIMEOUT, TRANSACTIONS_UNSUPPORTED, INDEXES_MISSING, TTL_INDEXES_MISSING, DATABASE_ERROR]
        serverVersion:
          type: string

    ServiceCheck:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, not_configured]

    Readiness:
      type: object
      additionalProperties: false
      required: [status, checks]
      properties:
        status:
          type: string
          enum: [ready, degraded, unavailable]
        checks:
          type: object
          additionalProperties: false
          required: [database, ai, uploads, email, googleSignIn, geocoding]
          properties:
            database:
              $ref: '#/components/schemas/DatabaseCheck'
            ai:
              $ref: '#/components/schemas/ServiceCheck'
            uploads:
              $ref: '#/components/schemas/ServiceCheck'
            email:
              $ref: '#/components/schemas/ServiceCheck'
            googleSignIn:
              $ref: '#/components/schemas/ServiceCheck'
            geocoding:
              $ref: '#/components/schemas/ServiceCheck'

    Live:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          const: ok

    LocationFields:
      description: Location fields shared by complaint filing and editing.
      type: object
      properties:
        address:
          type: string
          minLength: 3
          maxLength: 500
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180
        coordinateSource:
          type: string
          enum: [DEVICE, SUGGESTION]
          description: Required with coordinates, and allowed only with them.

  responses:
    ValidationFailed:
      description: The request failed validation.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: VALIDATION_ERROR
              message: Request validation failed
              details:
                - path: body.email
                  code: INVALID_VALUE
                  message: Invalid email address
            msg: Request validation failed
    Unauthorized:
      description: Not signed in, or the session is invalid or expired.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: UNAUTHENTICATED
              message: Session expired, please log in again
            msg: Session expired, please log in again
    Forbidden:
      description: The signed-in user may not do this, or the request origin is not allowed.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: FORBIDDEN
              message: You do not have permission to perform this action
            msg: You do not have permission to perform this action
    NotFound:
      description: No such resource.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: NOT_FOUND
              message: No complaint found with id 66f1a0c0a1b2c3d4e5f60001
            msg: No complaint found with id 66f1a0c0a1b2c3d4e5f60001
    Conflict:
      description: The request conflicts with current state (a duplicate, a stale version, or a rule such as a category still in use).
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: STALE_COMPLAINT
              message: This report changed; reload it and try again
            msg: This report changed; reload it and try again
    PayloadTooLarge:
      description: An image is above 10 MiB, or the images together are above 25 MiB.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: PAYLOAD_TOO_LARGE
              message: Upload exceeds allowed limits
            msg: Upload exceeds allowed limits
    UnsupportedMediaType:
      description: A file is not a supported image (JPEG, PNG or WebP), or an unexpected file field was sent.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: UNSUPPORTED_MEDIA_TYPE
              message: Unsupported media type
            msg: Unsupported media type
    RateLimited:
      description: Too many requests.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: RATE_LIMITED
              message: Too many requests, please try again later
            msg: Too many requests, please try again later
    ServiceUnavailable:
      description: A dependency needed for this request is unavailable or not configured.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: LOCATION_PROVIDER_UNAVAILABLE
              message: Location service is temporarily unavailable
            msg: Location service is temporarily unavailable
    ServerError:
      description: An unexpected error. The body never contains internal details; quote `requestId` when reporting it.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: INTERNAL_ERROR
              message: Something went wrong
              requestId: 3f6c2a1e-8d4b-4c7a-9e2f-1b5d7c9a0e11
            msg: Something went wrong

  requestBodies:
    Retirement:
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            properties:
              reason:
                type: string
                minLength: 1
                maxLength: 500

security:
  - cookieAuth: []

paths:
  /auth/signup:
    post:
      tags: [auth]
      summary: Create a citizen account and sign in
      description: Every sign-up is a citizen account; the role is never taken from the request.
      operationId: signup
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, password, name]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 8
                  maxLength: 128
                  description: 8 to 128 characters, and not the email address (400 `PASSWORD_REJECTED`).
                name:
                  type: string
                  minLength: 2
                  maxLength: 60
                phone:
                  type: string
                  maxLength: 30
                  pattern: '^$|^\+?[0-9 ().-]+$'
                  description: A phone number of 7 to 15 digits, optionally starting with +; spaces, dashes, dots and brackets are allowed. An empty value clears it.
            example:
              name: Ada Citizen
              email: ada@example.test
              password: Example-pass-1
      responses:
        '201':
          description: Account created; session cookies set.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Set-Cookie:
              $ref: '#/components/headers/SessionCookies'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [user]
                properties:
                  user:
                    $ref: '#/components/schemas/User'
              example:
                user:
                  _id: 66f1a0c0a1b2c3d4e5f60001
                  name: Ada Citizen
                  email: ada@example.test
                  role: citizen
                  isActive: true
                  authProvider: local
                  createdAt: '2026-09-24T09:00:00.000Z'
                  updatedAt: '2026-09-24T09:00:00.000Z'
                  __v: 0
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: An account with this email already exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: CONFLICT
                  message: An account with this email already exists
                msg: An account with this email already exists
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'

  /auth/login:
    post:
      tags: [auth]
      summary: Sign in with email and password
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 6
                  maxLength: 128
            example:
              email: ada@example.test
              password: Example-pass-1
      responses:
        '200':
          description: Signed in; session cookies set.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Set-Cookie:
              $ref: '#/components/headers/SessionCookies'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [user]
                properties:
                  user:
                    $ref: '#/components/schemas/User'
              example:
                user:
                  _id: 66f1a0c0a1b2c3d4e5f60001
                  name: Ada Citizen
                  email: ada@example.test
                  phone: '+2348000000000'
                  role: citizen
                  isActive: true
                  authProvider: local
                  createdAt: '2026-09-24T09:00:00.000Z'
                  updatedAt: '2026-09-24T09:00:00.000Z'
                  __v: 0
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          description: >
            Wrong email or password, an unknown email, or a retired account (one message for all).
            A suspended account also gets this answer unless the password is right.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: UNAUTHENTICATED
                  message: Invalid email or password
                msg: Invalid email or password
        '403':
          description: >
            `ACCOUNT_SUSPENDED` when the password is right but an administrator has suspended the
            account; `FORBIDDEN` when the request's origin is not allowed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: ACCOUNT_SUSPENDED
                  message: This account is suspended. Contact an administrator.
                msg: This account is suspended. Contact an administrator.
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'

  /auth/password/forgot:
    post:
      tags: [auth]
      summary: Ask for a password reset link
      description: >
        Always answers 202 with the same message, whether or not an account uses the address, and sends
        any email after answering, so neither the answer nor its timing reveals whether an account exists.
        An active password account gets a single-use link that expires in 30 minutes; a Google account is
        told to sign in with Google; suspended, retired and unknown addresses get nothing. Limited to 10
        requests per 15 minutes per client address and 3 per hour per email address.
      operationId: forgotPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email]
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 254
            example:
              email: ada@example.test
      responses:
        '202':
          description: Accepted.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
              example:
                msg: If an account uses this address, we have sent it a link to reset the password.
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
  /auth/password/reset:
    post:
      tags: [auth]
      summary: Set a new password with a reset link
      description: >
        The token comes from the link's address fragment (`#token=…`). The new password takes effect, every
        session of the account ends, and the account is emailed a notice; the caller is not signed in. An
        unknown, expired, used or replaced token gets 400 `INVALID_OR_EXPIRED_TOKEN`; a password equal to
        the email address gets 400 `PASSWORD_REJECTED` and leaves the link usable.
      operationId: resetPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token, password]
              properties:
                token:
                  type: string
                  minLength: 1
                  maxLength: 100
                password:
                  type: string
                  minLength: 8
                  maxLength: 128
            example:
              token: 3q2-7wEXAMPLEexampleEXAMPLEexampleEXAMPLE0
              password: Brand-new-pass
      responses:
        '200':
          description: Password reset; sign in with the new password.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
              example:
                msg: Password reset. Sign in with your new password.
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
  /auth/google:
    get:
      tags: [auth]
      summary: Start Google sign-in
      description: Redirects the browser to Google with a single-use state value.
      operationId: googleSignIn
      security: []
      responses:
        '302':
          description: Redirect to Google's consent page.
          headers:
            Location:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '503':
          description: Google sign-in is not configured on this server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: SERVICE_UNAVAILABLE
                  message: Google sign-in is not configured
                msg: Google sign-in is not configured
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'

  /auth/google/callback:
    get:
      tags: [auth]
      summary: Google sign-in callback
      description: >
        Called by Google. Always redirects to the reference client: to `/dashboard` with session
        cookies on success, or to `/login?error=google_auth_failed` on any failure.
      operationId: googleCallback
      security: []
      parameters:
        - name: code
          in: query
          schema:
            type: string
        - name: state
          in: query
          schema:
            type: string
      responses:
        '302':
          description: Redirect to the reference client.
          headers:
            Location:
              schema:
                type: string
        '429':
          $ref: '#/components/responses/RateLimited'

