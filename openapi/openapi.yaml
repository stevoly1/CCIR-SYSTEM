    post:
      tags: [complaints]
      summary: File a complaint
      description: >
        Classified by AI when available; if AI times out or fails, a fallback classification is used
        and filing still succeeds. With photos, send `multipart/form-data`: up to 5 images (JPEG,
        PNG or WebP), each at most 10 MiB and at most 25 MiB together. Images are re-encoded and
        stripped of metadata before storage.
      operationId: createComplaint
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [description, address]
              properties:
                description:
                  type: string
                  minLength: 10
                  maxLength: 2000
                categoryId:
                  $ref: '#/components/schemas/ObjectId'
                address:
                  type: string
                  minLength: 3
                  maxLength: 500
                latitude:
                  type: number
                  minimum: -90
                  maximum: 90
                longitude:
                  type: number
                  minimum: -180
                  maximum: 180
                coordinateSource:
                  type: string
                  enum: [DEVICE, SUGGESTION]
            example:
              description: Deep pothole outside the market gate
              address: 12 Market Road, Ikeja
              latitude: 6.6
              longitude: 3.35
              coordinateSource: SUGGESTION
          multipart/form-data:
            schema:
              type: object
              required: [description, address]
              properties:
                description:
                  type: string
                categoryId:
                  type: string
                address:
                  type: string
                latitude:
                  type: string
                longitude:
                  type: string
                coordinateSource:
                  type: string
                image:
                  type: array
                  maxItems: 5
                  items:
                    type: string
                    format: binary
      responses:
        '201':
          description: The filed complaint, as its reporter sees it.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [complaint]
                properties:
                  complaint:
                    $ref: '#/components/schemas/Complaint'
              example:
                complaint:
                  _id: 66f1a0c0a1b2c3d4e5f60020
                  referenceCode: CCIR-EXAMPLE1
                  status: PENDING
                  priority: HIGH
                  description: Deep pothole outside the market gate
                  category:
                    _id: 66f1a0c0a1b2c3d4e5f60010
                    name: Roads
                    recordedName: Roads
                    isActive: true
                    deleted: false
                  address: 12 Market Road, Ikeja
                  hasPrecisePosition: true
                  imageCount: 0
                  thumbnailUrl: null
                  createdAt: '2026-09-24T09:20:00.000Z'
                  updatedAt: '2026-09-24T09:20:00.000Z'
                  reporter:
                    userId: 66f1a0c0a1b2c3d4e5f60001
