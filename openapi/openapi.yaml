  /users/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    patch:
      tags: [users]
      summary: Update a user (administrators)
      description: >
        Changes details, role or active state. Role and active-state changes revoke the user's
        sessions and are refused when they would leave no active administrator. Suspending
        (`isActive: false`) records when, by whom and, with `reason`, why; reactivating clears it.
        A `reason` on any other change is refused with 400, and a new reason for an account that is
        already suspended with 409 (reactivate it first). Retiring an account removes its suspension record.
      operationId: updateUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name:
                  type: string
                  minLength: 2
                  maxLength: 60
                email:
                  type: string
                  format: email
                phone:
                  type: string
                  maxLength: 30
                  pattern: '^$|^\+?[0-9 ().-]+$'
                  description: A phone number of 7 to 15 digits, optionally starting with +; spaces, dashes, dots and brackets are allowed. An empty value clears it.
                role:
                  $ref: '#/components/schemas/Role'
                isActive:
                  type: boolean
                reason:
                  type: string
                  minLength: 1
                  maxLength: 500
                  description: Why the account is suspended. Only with `isActive` false.
            example:
              isActive: false
              reason: Repeated abusive reports
      responses:
        '200':
          description: The updated user.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [user]
                properties:
                  user:
                    $ref: '#/components/schemas/User'
              example:
                user:
                  _id: 66f1a0c0a1b2c3d4e5f60003
                  name: Bola Adeyemi
                  email: bola@example.test
                  role: agency
                  isActive: false
                  authProvider: local
                  suspendedAt: '2026-09-24T09:10:00.000Z'
                  suspendedBy: 66f1a0c0a1b2c3d4e5f60001
                  suspensionReason: Repeated abusive reports
                  createdAt: '2026-09-24T09:00:00.000Z'
                  updatedAt: '2026-09-24T09:10:00.000Z'
                  __v: 0
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
    delete:
      tags: [users]
      summary: Retire a user's account (administrators)
      description: Like deleting one's own account, performed by an administrator for another user.
      operationId: retireUser
      requestBody:
        $ref: '#/components/requestBodies/Retirement'
      responses:
        '200':
