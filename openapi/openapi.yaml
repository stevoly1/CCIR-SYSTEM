      tags: [health]
      summary: Process liveness
      description: Answers from the process alone; never checks the database. Never rate-limited.
      operationId: healthLive
      security: []
      responses:
        '200':
          description: The process is serving requests.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Live'
              example:
                status: ok

  /health/ready:
    get:
      tags: [health]
      summary: Readiness to serve traffic
      description: >
        `ready` when the database is a reachable replica set with every unique index and every
        optional service is configured; `degraded` when an optional service (AI, uploads, email,
        Google sign-in) is not configured, or when a TTL index is missing (the database check then
        reads `TTL_INDEXES_MISSING`: sessions and throttles would stop expiring); `unavailable` (503)
        when the database check fails. Never
        exposes setting values or connection details. Never rate-limited; the database result is
        shared by concurrent calls and reused for up to `READINESS_CACHE_MS` (default one second).
      operationId: healthReady
      security: []
      responses:
        '200':
          description: Ready, or degraded.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'
              example:
                status: degraded
                checks:
                  database:
                    status: ok
                    serverVersion: 8.3.11
                  ai:
                    status: ok
                  uploads:
                    status: ok
                  email:
                    status: not_configured
                  googleSignIn:
                    status: ok
                  geocoding:
                    status: ok
        '503':
          description: The database is unavailable, not a replica set, or missing a unique index.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'
              example:
                status: unavailable
                checks:
                  database:
                    status: unavailable
                    reason: INDEXES_MISSING
                  ai:
                    status: ok
                  uploads:
                    status: ok
                  email:
                    status: ok
                  googleSignIn:
                    status: ok
                  geocoding:
                    status: ok

  /docs:
    get:
      tags: [contract]
      summary: Interactive documentation (Swagger UI)
      description: >
        Renders this contract in the browser. Served from this server under the application's own
        security policy. Switched off (404) with `API_DOCS_UI=false`; the JSON contract stays
        available. "Try it out" can read with the current session; write operations from this page
        are refused by the browser-origin rule unless the page is served from `BROWSER_ORIGIN`.
      operationId: getDocs
      security: []
      responses:
        '200':
          description: The documentation page.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            text/html:
              schema:
                type: string
              example: '<!doctype html><html lang="en"><head><title>CCIR API</title></head><body><div id="swagger-ui"></div></body></html>'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'

