# Continuous integration (Phase 4a, DEP-002). Every step is an npm script that also runs locally.
# No secrets: every test uses in-memory MongoDB and no external service.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  # A newer commit replaces a pull request's run; runs on main always finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NPM_VERSION: 12.1.0
  MONGOMS_DOWNLOAD_DIR: /home/runner/.cache/mongodb-binaries

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json
      - run: npm install -g npm@${{ env.NPM_VERSION }}
      - run: npm ci
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.MONGOMS_DOWNLOAD_DIR }}
          key: mongodb-${{ runner.os }}-${{ hashFiles('tests/setup/mongoVersion.cjs') }}
      # Without mongodump/mongorestore the backup and restore rehearsal skips itself.
      - name: Install MongoDB Database Tools 100.19.0
        run: |
          curl -fsSLo "$RUNNER_TEMP/tools.tgz" https://fastdl.mongodb.org/tools/db/mongodb-database-tools-ubuntu2404-x86_64-100.19.0.tgz
          echo "46d9dcba4ff2049c0ac6139f77783d14b1492d8910534ea6e95de50688afe72e  $RUNNER_TEMP/tools.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/tools.tgz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/mongodb-database-tools-ubuntu2404-x86_64-100.19.0/bin" >> "$GITHUB_PATH"
      - name: Unit and integration tests with coverage and contract checks
        run: npm run test:coverage -- --reporter=default --reporter=json --outputFile="$RUNNER_TEMP/results/backend.json"
      - name: Every test ran
        run: npm run check:test-results -- "$RUNNER_TEMP/results/backend.json"
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-results
          path: ${{ runner.temp }}/results
          retention-days: 7
          if-no-files-found: ignore

  client:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json
      - run: npm install -g npm@${{ env.NPM_VERSION }}
      - run: npm ci
      - run: npm ci
        working-directory: client
      - name: Client unit tests
        run: npm --prefix client run test:unit -- --reporter=default --reporter=json --outputFile="$RUNNER_TEMP/results/client.json"
      - name: Every test ran
        run: npm run check:test-results -- "$RUNNER_TEMP/results/client.json"
      - run: npm --prefix client run lint
      - run: npm --prefix client run build
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: client-results
          path: ${{ runner.temp }}/results
          retention-days: 7
          if-no-files-found: ignore

  journeys:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json
      - run: npm install -g npm@${{ env.NPM_VERSION }}
      - run: npm ci
      - run: npm ci
        working-directory: client
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.MONGOMS_DOWNLOAD_DIR }}
          key: mongodb-${{ runner.os }}-${{ hashFiles('tests/setup/mongoVersion.cjs') }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /home/runner/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('client/package-lock.json') }}
      # Chrome comes with the runner image; WebKit and its system libraries are installed here.
      - run: npx playwright install --with-deps webkit
        working-directory: client
      - name: Journeys in Chrome and WebKit on the production build
        run: npm --prefix client run test:e2e
        env:
          TEST_RESULTS_DIR: ${{ runner.temp }}/results
      - name: Every journey ran
        run: npm run check:test-results -- "$RUNNER_TEMP/results/e2e-chrome.json" "$RUNNER_TEMP/results/e2e-webkit.json"
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: journeys-results
          path: |
            ${{ runner.temp }}/results
            /tmp/ccir-playwright-results
          retention-days: 7
          if-no-files-found: ignore

  safety:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json
      - run: npm install -g npm@${{ env.NPM_VERSION }}
      # npm audit needs only the lockfiles, so the client is not installed here.
      - run: npm ci
      - name: Private-file guard
        run: npm run check:tracked-files
      - name: Install gitleaks 8.30.1
        run: |
          curl -fsSLo "$RUNNER_TEMP/gitleaks.tgz" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks
      - name: Secret scan (whole history, redacted)
        run: npm run check:secrets
        env:
          GITLEAKS_BIN: ${{ runner.temp }}/gitleaks
      - name: Dependency audit (production, high and critical)
        run: npm run check:audit
